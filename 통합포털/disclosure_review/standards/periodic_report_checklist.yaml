    경과·투자금액·성과) 까지 구체적으로 기재
- id: 11-2
  chapter: 11
  chapter_title: 그 밖에 투자자 보호를 위하여 필요한 사항
  title: 우발채무 등에 관한 사항
  keywords:
  - 우발채무
  must: 소송은 본안소송 + 가처분·가압류 등 본안전소송 모두 포함, 회사 영업에 중대한 영향을 미칠 가능성이 있는 건만 대상 / 연결재무제표 작성 상장법인은 주요종속회사(자산총액
    10% 이상 또는 750억원 이상) 내용을 연결실체 관점에서 반드시 포함(소송·채무보증·채무인수·우발채무 공통 원칙) / 채무보증은 사업연도 초일·말일 기준 건수 및 잔액 합계
    + 재무상태·영업실적에 중요한 영향을 미치는 계약은 채무자·채권자·금액·기간까지 별도 요약 / 한국표준산업분류상 "건설업"에 해당하면 부동산PF 관련 우발부채(신용보강·중도금대출·SOC보증
    등)를 별도 종합요약표로 추가 기재 — 동양이 건설업 분류에 해당하는지 기획팀과 사전 확인 필요 / 자산유동화 관련 신용보강을 제공했거나 장래매출채권 유동화증권을 발행했으면 그
    현황과 유동화채무 비중(총차입금·매출액·매출채권 대비) 기재
- id: 11-3
  chapter: 11
  chapter_title: 그 밖에 투자자 보호를 위하여 필요한 사항
  title: 제재 등과 관련된 사항
  keywords:
  - 제재 등과 관련된 사항
  must: 기재대상 임직원은 이사·감사·업무집행지시자·집행임원 + 재무·회계·기획·연구개발·공시업무 등 임원에 준하는 중요한 역할을 하는 직원 까지 포함 / 경미한 제재(경고·주의)·미확정
    사실(검찰통보)·취소된 행정조치는 기재 생략 가능하나, 조세범처벌법 제3조·제10조 위반은 위반사실·금액·추징세액까지 상세 기재 필수 / 단기매매차익 미환수 건은 건별로 반환청구여부·조치계획·제척기간
    까지 기재 / 중대재해는 발생일자·고용노동부 보고일자·재해내용(사망자·부상자수)·조치 및 전망을 건별로 기재
