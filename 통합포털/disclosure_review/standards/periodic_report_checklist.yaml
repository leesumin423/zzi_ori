    도래현황 ③ 재무비율준수·차입제한·배당제한 등 조건 미준수 시 영향 ④ 향후 조달형태·비용 변화 예상 — 4가지 모두 기재 / 부외거래는 현황·발생원인·상대방·거래조건·후속사건·회사에
    미치는 영향까지 기재
  omit_for:
