# 정기보고서 작성지침서(제1~12장) "필수 체크"를 그대로 옮긴 확장 체크리스트.
#
# 각 항목은 초안(.dsd)에서 해당 소제목이 실제로 존재하는지를 섹션 제목
# 키워드 포함 여부로 '구조적으로만' 확인한다 - 안에 들어간 내용(숫자, 조건
# 충족 여부 등)까지는 검증하지 못한다. 그래서 미발견 시에도 fail이 아니라
# warn으로만 표시하고(제목 표현이 실제 DART 문서와 다를 수 있어서), must 항목은
# 발견 여부와 무관하게 결과 화면의 '작성기준 필수 체크 참고'에 항상 노출해
# 담당자가 직접 대조하도록 한다.
#
# 출처: 정기보고서_작성지침서(Artifact/docx) - "기업공시서식 작성기준"
# (2026.6.30. 시행) 발췌 기반, 12개 장 44개 항목 전체.

items:
- id: 1-1
  chapter: 1
  chapter_title: 회사의 개요
  title: 회사의 개요
  keywords:
  - 회사의 개요
  must: '12개 항목 중 특히: ① 연결대상 종속회사 개황(사업·분기·반기보고서 전부 해당, 없으면 "해당없음" 명기) ② 중소·벤처·중견기업 해당 여부 3가지 모두 표시 ③
    주요사업 300자 내외 서술 ④ 주권상장 현황(없으면 "해당사항 없음")'
- id: 1-2
  chapter: 1
  chapter_title: 회사의 개요
  title: 회사의 연혁
  keywords:
  - 회사의 연혁
  must: 경영진·감사 변동은 대표이사 변동 / 최대주주인 임원의 변동 / 주요주주인 임원의 변동 / 등기임원 1/3 이상 변동 중 하나에 해당할 때만 기재합니다(사소한 임원 교체는
    대상 아님 — 인사 변동 내역을 법무팀과 대조 확인).
- id: 1-3
  chapter: 1
  chapter_title: 회사의 개요
  title: 자본금 변동사항
  keywords:
  - 자본금 변동사항
  must: 무액면주식 발행회사는 액면금액란에 '-' 표시 후 발행가액÷발행주식수를 하단에 별도 기재. 종류주식(기타)이 있으면 구체적 종류를 표 하단에 명기.
- id: 1-4
  chapter: 1
  chapter_title: 회사의 개요
  title: 주식의 총수 등
  keywords:
  - 주식의 총수 등
  must: 주요사항보고서를 낸 자기주식 취득/처분/신탁계약 건이 있으면 이행률 70% 미만 시 미이행 사유 필수 기재 / 단기계획 이행현황에서 이행률이 70% 미만이거나 130%
    초과하면 차이발생 사유 필수 기재 / 보유현황표 '기말수량' 합계는 반드시 작성기준일 현재 실제 보유수량과 일치(회계팀 재고대사 필수) / 단기계획 대상기간이 보고서 종류마다
    다름 — 반기보고서는 당해년도 계획+상반기 이행현황, 사업보고서는 익년도 계획+당해연도 전체 이행현황
- id: 1-5
  chapter: 1
  chapter_title: 회사의 개요
  title: 정관에 관한 사항
  keywords:
  - 정관에 관한 사항
  must: 정기주주총회 이전에 보고서를 제출하면 정관변경안건이 정기주총 안건에 포함되었는지 여부 반드시 기재 / 사업목적은 정관상 전체를 빠짐없이 나열(일부 발췌 금지) — '영위'
    판정은 단순 계획 수립만으로는 부족, 실제 추진현황이 있어야 함 / 신규 사업목적 추가 시 8개 세부사항(투자소요액·추진현황·위험 등) 원칙적으로 전부 기재 — 영업비밀 우려
    시 그 사유를 명시하고 해당 부분만 생략 가능(전면 생략 불가)
- id: 2-0
  chapter: 2
  chapter_title: 사업의 내용
  title: 사업부문 구분 총칙
  keywords:
  - 사업부문 구분 총칙
  must: 표가 50행을 초과 하면 표 전체를 상세표(제12장)로 옮기고 본문엔 요약현황 + "상세표에 기재함" 문구만 남깁니다. 외부자료 인용 시 출처(자료명·발간일자·발간기관)를
    반드시 명기하세요.
- id: 2-1
  chapter: 2
  chapter_title: 사업의 내용
  title: 사업의 개요
  keywords:
  - 사업의 개요
  must: 아래 「2. 주요 제품 및 서비스」와 「4. 매출 및 수주상황」 내용은 이 요약에 반드시 포함 해야 합니다(다른 항목은 순서 무관하게 통합 서술 가능).
- id: 2-2
  chapter: 2
  chapter_title: 사업의 내용
  title: 주요 제품 및 서비스
  keywords:
  - 주요 제품
  - 서비스
  must: 수익성에 중요한 영향을 미치는 가격변동이 있었다면 공시대상기간 전체에 걸친 가격 비교치 를 반드시 제시. OEM 매출이 있으면 상대방·상표명도 기재.
- id: 2-3
  chapter: 2
  chapter_title: 사업의 내용
  title: 원재료 및 생산설비
  keywords:
  - 원재료
  - 생산설비
  must: 서비스업 등 물적 생산이 주요 수익원이 아니면 생산능력·실적·가동률 생략 가능 / 시가(토지=공시지가, 건물=지방세 과세시가표준액) 생략 시 "금액적 중요성이 없어 생략한다"는
    사실을 반드시 명기 / 소유권 없거나 담보설정 등 처분 제한이 있는 물적재산은 보유·이용현황과 제한사유 기재
- id: 2-4
  chapter: 2
  chapter_title: 사업의 내용
  title: 매출 및 수주상황
  keywords:
  - 수주상황
  must: 수출기업은 수출·내수 반드시 구분 기재 / 주요 매출처 및 매출처별 비중은 생략 규정 없이 필수 기재 / 판매전략은 영업기밀 우려 시 생략 가능하나, 이미 언론·공시로
    공개된 내용은 반드시 기재 (선택적 생략 아님) / 수주현황은 품목/수주일자/납기/수주총액/기납품액/수주잔고 표로, 계절적 변동요인 등 있으면 추가 기재
- id: 2-5
  chapter: 2
  chapter_title: 사업의 내용
  title: 위험관리 및 파생거래
  keywords:
  - 위험관리
  - 파생거래
  must: 시장위험 노출이 중요하지 않아 생략하는 경우 "노출이 중요하지 않아 생략한다"는 사실을 반드시 기재 — '중요하지 않은 경우'는 공시대상기간 중 외환 포지션·손익이 전혀
    없거나, 파생상품 계약이 없고 향후 2년 체결 계획도 없는 경우 로 엄격히 한정 / 파생상품 통합기재 시 평가손익은 이익·손실을 상계하지 않고 각각 총액으로 기재 (순액 표시
    금지)
- id: 2-6
  chapter: 2
  chapter_title: 사업의 내용
  title: 주요계약 및 연구개발활동
  keywords:
  - 주요계약
  - 연구개발활동
  must: 계약을 체결했으나 기준일 현재 효력 미발생이거나 이행 미완료인 계약도 포함 (체결만 되고 누락하면 안 됨) / 연구개발비용은 정부보조금 차감 전 총액 과 정부보조금을 구분해서
    각각 기재(순액만 기재 금지)
- id: 2-7
  chapter: 2
  chapter_title: 사업의 내용
  title: 기타 참고사항
  keywords:
  - 기타 참고사항
  must: 지적재산권은 종류/취득일/내용/보호기간/투입비용/상용화 여부/매출기여도/기대효과까지 8개 세부사항 포함 / 사업부문별 시장점유율 추이는 대상항목·산정기준·자료출처 명시
    필수 / 사업부문별 재무정보는 공통 자산/비용의 배부기준을 요약 기재 , 배부기준 변경 시 사유·변경내용 기재 / 신규사업 추진 시 사업분야·투자소요액·추진현황 등 기재 — 단,
    정관상 사업목적 추가로 추진하는 신규사업은 「① 회사의 개요 · 5. 정관에 관한 사항」에서 기재 (중복 방지 위해 여기서는 제외)
- id: 3-1
  chapter: 3
  chapter_title: 재무에 관한 사항
  title: 요약재무정보
  keywords:
  - 요약재무정보
  must: 연결재무제표 작성법인은 연결 요약정보 + 개별(별도) 요약정보 둘 다 기재(순서는 연결 먼저) / 외국기업이거나 재무제표가 외화 표시인 경우 환산 기준환율·환산방법 추가
    기재 / 제5-1-4조는 삭제된 조문 — 해당 번호는 결번으로 신경 쓰지 않아도 됨
- id: 3-2~3-5
  chapter: 3
  chapter_title: 재무에 관한 사항
  title: 연결재무제표 / 연결재무제표 주석 / 개별재무제표 / 개별재무제표 주석
  keywords:
  - 연결재무제표
  - 연결재무제표 주석
  - 개별재무제표
  - 개별재무제표 주석
  must: 회계감사인의 감사결과 수정된 최종 재무제표를 기재(감사 전 재무제표 아님) / 감사를 받지 않은 재무제표가 있으면 해당 연도 재무제표 상단에 그 사실 명기 / 정기주총에서
    재무제표 안건이 승인되기 전 이면 "주주총회 승인전 재무제표"라는 문구와, 향후 부결·수정 시 정정보고서로 반영 예정이라는 문구를 하단에 표시 / 재무제표 주석은 당기 + 직전기
    2개년분만 기재 가능(공시대상기간 전체가 아니어도 됨)
- id: 3-6
  chapter: 3
  chapter_title: 재무에 관한 사항
  title: 배당에 관한 사항 등
  keywords:
  - 배당에 관한 사항 등
  must: 배당기준일을 배당액결정일(이사회결의일) 이후 로 정할 수 있는지(O/X) — 못하면 향후 정관개정 계획도 기재 / 당기 현금(주식)배당금총액에는 정기주총 결의·상정 예정분
    + 사업연도 중 분기·중간배당 합산 / 정기주총 승인 전이면 "승인전 금액, 부결·수정 시 정정보고서 반영 예정" 문구 하단 표시 / 연속 배당횟수는 최근 분·반기 또는 결산기
    배당지급 현황을 반드시 포함 해 산출
- id: 3-7
  chapter: 3
  chapter_title: 재무에 관한 사항
  title: 증권의 발행을 통한 자금조달에 관한 사항
  keywords:
  - 증권의 발행을 통한 자금조달에 관한 사항
  must: 미상환 잔액은 발행 시기와 무관 하게 작성기준일 현재 잔액이 있으면 전부 포함 / 연결재무제표 작성대상법인은 연결기준 + 별도(개별)기준 둘 다 작성 / ESG채권은 증권종류란에
    종류(녹색·사회적·지속가능·지속가능연계채권) 병기 + 표 하단에 실제 사용내역 요약 / 공모·사모자금 사용내역표에서 금액차이·용도차이 발생사유 는 빠뜨리기 쉬운 항목 — 차이가
    있으면 반드시 사유 기재 / 해당사항 없으면 하이픈(-) 표시(빈칸 금지)
- id: 3-8
  chapter: 3
  chapter_title: 재무에 관한 사항
  title: 기타 재무에 관한 사항
  keywords:
  - 기타 재무에 관한 사항
  must: 재무제표를 재작성 한 경우 사유·내용·영향을 요약(전기오류수정 표 활용 가능) / 대손충당금·재고자산 현황은 공시서류 다른 부분(주석 등)에 이미 동일하게 기재된 경우
    생략 가능 — 단, 다른 부분에 전부/일부가 없으면 생략 불가 / 매출채권 합계액이 총자산의 2% 미만이면서 10억원 미만이면 경과기간별 잔액현황 기재 생략 가능 / 수주계약현황은
    계약수익금액이 직전연도 매출액의 5% 이상 인 계약만 대상 / 최근 3사업연도 중 합병·분할·자산양수도·영업양수도가 있었으면 시기·대상회사·주요내용·관련 공시서류 제출일 기재
- id: 4-1
  chapter: 4
  chapter_title: 이사의 경영진단 및 분석의견
  title: 일반원칙 · 예측정보 주의사항 · 개요
  keywords:
  - 일반원칙
  - 예측정보 주의사항
  must: 단순히 재무제표를 서술식으로 반복하거나, 충분한 분석 없이 전기 대비 금액만 단순 비교하면 안 됨 — 반드시 원인·근거·중요성 분석 을 포함 / K-IFRS 연결재무제표
    작성 상장법인은 주요종속회사 내용을 반드시 포함 , 연결실체 전체 관점에서 기재 / 경영진이 실제 쓰는 주요경영지표(EBIT·EBITDA·ROE 등)가 있으면 지표와 산출방법도
    함께 기재
  omit_for:
  - 분기보고서
  - 반기보고서
- id: 4-2
  chapter: 4
  chapter_title: 이사의 경영진단 및 분석의견
  title: 재무상태 및 영업실적
  keywords:
  - 재무상태
  - 영업실적
  must: 신규사업 진출을 결정·공표했으면 개요·위험요소·진행경과·영향을 분석 기재(직전 2개년 내 결정 건은 계획 대비 진행경과 차이도 추가) / 중단사업이 있으면 사유·영향·향후
    처리방안(재개 시 자금조달방안 포함) 기재 / 조직변경·사업부문 재조직·조기퇴직 등 "경영합리화" 실행 시 목적·이행기간·이행내용·변경사항 기재 / 환율변동이 중요한 영향을 미치면
    변동추이·영향·회피조치 기재, 자산손상·감액이 있으면 기준·원인·(외부평가 대비) 실제결과 비교 기재
  omit_for:
  - 분기보고서
  - 반기보고서
