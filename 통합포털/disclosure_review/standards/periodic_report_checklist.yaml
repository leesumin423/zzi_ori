  must: '"중대한 변화"는 자산·부채·손익이나 그 전망에 현저한 변동이 발생했거나 예상되는 경우 — 이미 공시서류 다른 부분에 기재됐으면 생략 가능 / 합병 등 사후정보는 괴리율
