- id: 5-1
  chapter: 5
  chapter_title: 회계감사인의 감사의견 등
  title: 회계감사인의 감사의견 등
  keywords:
  - 회계감사인의 감사의견 등
  must: 비감사용역 계약현황에서 회계감사와 동시 제공이 제한되는 용역 인지 여부를 구분 표시 / 내부감사기구(감사·감사위원회)가 감사인 선임 등과 관련해 논의한 주요 내용과 결과
    를 요약 기재 / 회계감사인이 최근 3년 이내 변경됐으면 변경사유(계약만료·감사인 지정 등) 명확히 구분 기재
- id: 5-2
  chapter: 5
  chapter_title: 회계감사인의 감사의견 등
  title: 내부통제에 관한 사항
  keywords:
  - 내부통제에 관한 사항
  must: 내부통제구조 평가 결과 중요한 취약점 이 있으면 내용과 시정조치 계획(또는 진행 중인 절차)을 요약 / 취약점이 없으면 "해당사항 없음"으로 명기(공란 금지)
- id: 5-3
  chapter: 5
  chapter_title: 회계감사인의 감사의견 등
  title: 내부회계관리제도
  keywords:
  - 내부회계관리제도
  must: 경영진·감사(위원회) 평가결론은 각각 "효과적으로 설계·운영되고 있다고 판단" / "…있지 않다고 판단" 중 하나로만 기재 / 운영실태보고서·평가보고서 보고일자 는 사업보고서
    첨부서류(내부회계관리제도운영보고서)와 반드시 동일하게 기재 / 감사인 의견 유형이 감사 인지 검토 인지 구분, 적정의견 외의 의견이면 지적사항 요약 + 회사 대응조치 기재 /
    연결 내부회계관리제도를 운영 중이면(외감법 시행령 제9조제2항제6호) 지배기업 기준 으로 기재 / 내부회계관리·운영조직 인력현황·회계담당자 경력은 내부회계관리제도운영보고서와 동일하게
    기재(별도 산정 금지)
- id: 6-1
  chapter: 6
  chapter_title: 이사회 등 회사의 기관에 관한 사항
  title: 이사회에 관한 사항
  keywords:
  - 이사회에 관한 사항
  must: 안건은 개최일자별로 빠짐없이 열거(일상적 사항이거나 경쟁적 지위를 중대하게 위협하는 경우만 생략 가능) / 이사의 경업·겸업 승인, 자기거래 승인, 회사 사업기회 이용
    승인 안건은 이사 이름·승인대상·승인범위 까지 구체적으로 기재 / 의결현황은 안건별 가결/부결/보류 구분, 보류 사유 와 반대한 이사의 이름·사유 까지 기재 / 각 이사의 회차별
    참석현황·안건별 찬반현황 기재 / 사외이사 지원조직·교육실적이 없으면 "없다"는 사실과 사유를 명시(침묵 금지)
- id: 6-2
  chapter: 6
  chapter_title: 이사회 등 회사의 기관에 관한 사항
  title: 감사제도에 관한 사항
  keywords:
  - 감사제도에 관한 사항
  must: 감사위원이 회계·재무전문가 (상법 제542조의11)이면 전문가 유형(4가지 중 택1)과 관련 경력을 추가로 기재 / 감사위원회/감사 활동내용은 작성기준일이 속한 사업연도
    개시일부터 작성기준일까지 의 안건·의결현황·주요활동 기재 / 교육계획·실적은 일자·주체·참석자·불참사유·내용까지, 실시 내역이 없으면 사실과 사유를 기재 / 지원조직이 없으면
    "없다"는 사실을 명시
- id: 6-3
  chapter: 6
  chapter_title: 이사회 등 회사의 기관에 관한 사항
  title: 주주총회 등에 관한 사항
  keywords:
  - 주주총회
  must: 사업보고서를 정기주총 이전에 제출하고 투표제도 변경 정관안건이 상정 예정 이면 그 사실과 변경예정 내용을 표 하단에 기재 / 실시여부는 "제○○기(○○년도) 정기주총(또는
    임시주총)" 형태로 해당기간 실시 내역 전부 기재 / 주주총회 의사록 요약은 정기·임시 구분 , 안건에 주주제안 여부 를 괄호로 표시, 안건별 표결수(찬성/반대·기권 주식수·비율)까지
    기재 / 경영권 경쟁·소수주주권 행사가 있었으면 당사자·진행경과·회사가 취한 조치까지 기재(공시 등으로 외부에 알려진 경우에 한함)
- id: 7-1
  chapter: 7
  chapter_title: 주주에 관한 사항
  title: 최대주주 및 그 특수관계인의 주식소유 현황
  keywords:
  - 최대주주
  - 그 특수관계인의 주식소유 현황
  must: 최대주주가 법인·단체면 기본정보(대표자·최대출자자 등)·최근 결산기 재무현황(자산·부채·자본·매출·영업이익·순이익)·사업현황 까지 포함 / 최대주주 변동을 초래할 수 있는
    특정거래(매매예약·주식담보제공 등)가 있으면 기재 / 최대주주·특수관계인이 당사자인 주주간 계약 (이익공유약정·이사지명권·동반매도청구권 등)이 있으면 내용과 이행현황 기재(경영상
    비밀에 해당하면 생략 가능) / 사업연도 중 최대주주가 변경됐으면(경영권 양수도계약 포함) 인수조건·인수자금 조달방법 까지 추가 기재
- id: 7-2
  chapter: 7
  chapter_title: 주주에 관한 사항
  title: 주식소유 현황 · 주가 및 주식거래실적
  keywords:
  - 주식소유 현황
  - 주식거래실적
  must: 반기·분기보고서에서 결산일 현재 주식소유현황 파악이 어려우면 대량보유상황보고 내역 기반 "보유현황"으로 대체 가능 — 이 경우 '보유현황'이라는 사실과 결산일 기준과 차이
    발생 가능성을 명시 / 거래시장·주식종류별로 월별 최고·최저·평균주가 와 월별 최고·최저 일거래량·월간거래량 기재
- id: 8-1
  chapter: 8
  chapter_title: 임원 및 직원 등에 관한 사항
  title: 임원의 현황
  keywords:
  - 임원의 현황
  must: 기준일 이후 공시서류 제출일 사이 신규 선임 임원은 추가 기재 , 퇴임 임원은 표 하단에 사실·사유 별도 기재 / 과거 임원으로 재직했던 회사가 파산·회생·경영정상화이행약정
    을 겪은 이력이 있으면(그 발생 전 1년 이내 재임 포함) 주요경력에 포함 / 미등기임원으로 5년 이상 계속 재직 했으면 주요경력·재직기간·임기만료일 기재 생략 가능 / 정기주총
    이전에 사업보고서를 제출하면 등기임원 선임후보자·해임대상자 현황 표 추가 기재(부결 시 정정보고서로 삭제)
- id: 8-2
  chapter: 8
  chapter_title: 임원 및 직원 등에 관한 사항
  title: 직원 등의 현황
  keywords:
  - 직원 등의 현황
  must: ‘직원’에는 미등기임원 포함 해서 집계 / 1인평균급여액은 사업연도 개시일~작성기준일까지 월별 평균의 합 (반기보고서=6개월분, 사업보고서=12개월분)으로 산정 — 연환산
    단순추정 금지 / 평균근속연수·1인평균급여액의 '합계'란은 사업부문별 수치의 단순합계가 아니라 회사 전체 평균 을 별도 계산해 기재 / 육아휴직 사용률은 당해 출산 이후 1년
    이내 사용자 수 / 출생일로부터 1년 이내 자녀가 있는 근로자 수 산식으로 계산 / 미등기임원 보수는 공시서류작성일 기준 재임 중인 인원 으로 인원수 산정
- id: 8-3
  chapter: 8
  chapter_title: 임원 및 직원 등에 관한 사항
  title: 이사·감사의 보수 현황
  keywords:
  - 감사의 보수 현황
  must: 보수총액은 근로소득지급명세서 기준 (급여·상여·주식매수선택권 행사이익·임원퇴직소득금액 한도초과액 등의 합계)으로 산정 — 회계상 비용인식액이 아님 / 보수지급금액은 기준일
    현재 재임 중인 자 + 공시대상기간 중 퇴직한 자 모두 포함 / ‘2-1 이사·감사 전체’ 수치는 반드시 ‘2-2 유형별’ 합계와, ‘2-2’는 다시 ‘2-3 소득종류별’ 합계와
    일치 해야 함 / 개인별 보수 5억원 이상자가 있으면 개인별 산정기준 및 방법을 구체적으로 기재(단순 금액만 기재 불가) / 기준일이 속한 사업연도 개인별 보수 5억원 이상 임직원
    중 상위 5명 은 이사·감사와 별도로 추가 기재(중복돼도 별도 작성) / 성과연동 보수(인센티브)는 성과지표·평가방법·개인보상 연계방법을 구체적으로 서술(단순 "성과에 따라 지급"
    같은 추상적 서술 금지)
- id: 8-4
  chapter: 8
  chapter_title: 임원 및 직원 등에 관한 사항
  title: 주식매수선택권의 부여 및 행사현황
  keywords:
  - 주식매수선택권의 부여
  - 행사현황
  must: 회사가 주식매수선택권·주식기준보상 제도를 운영하지 않으면 "해당사항 없음"으로 명기 (항목 자체 생략 금지). 운영 중이면 부여받은 자별 관계(등기임원/미등기임원/직원
    등)·부여방법·행사기간·행사가격을 표로 기재.
- id: 9-1
  chapter: 9
  chapter_title: 계열회사 등에 관한 사항
  title: 계열회사의 현황(요약)
  keywords:
  - 계열회사의 현황(요약)
  must: 계열회사간 업무조정·이해관계 조정 기구가 있으면 현황 기재 / 계열회사 중 회사 경영에 직접·간접 영향력을 미치는 회사가 있으면 회사명·내용 기재 / 계통도는 계열관계
    형성·유지에 중요한 역할이 없는 해외법인은 생략 가능 / 임원 겸직현황은 상근·비상근 여부 구분 기재
- id: 9-2
  chapter: 9
  chapter_title: 계열회사 등에 관한 사항
  title: 타법인 출자현황(요약)
  keywords:
  - 타법인 출자현황(요약)
  must: '기재 대상: 출자비율 5% 초과 또는 장부가액 1억원 초과 (기초 또는 기말 기준) 법인 / 취득(처분)금액은 순액 으로 기재 / 상세표(제12장)의 출자금액과 이 요약표의
    출자금액이 반드시 일치 해야 함'
- id: 10-1
  chapter: 10
  chapter_title: 대주주 등과의 거래내용
  title: 대주주 등에 대한 신용공여 등
  keywords:
  - 대주주 등에 대한 신용공여 등
  must: 해당기간 중 거래가 없어도 기초 또는 기말 잔액이 3억원 이상 이면 반드시 기재 / 임원 복리후생 대여(학자금·주택자금·의료비) 또는 거래상대방별 잔액합계 3억원 미만
    이면 기재 생략 가능 / 거래조건은 만기·이율·수수료뿐 아니라 통상적 조건과 다른 경우 그 사유 까지 기재 / 주주총회 승인·이사회 결의 등 내부통제절차 여부 와, 거치지 않았다면
    그 사유·의사결정방법 기재
