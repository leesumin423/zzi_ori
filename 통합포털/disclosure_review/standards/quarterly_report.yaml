# 분기보고서(11013) 시드 체크리스트.
#
# 출처: 「기업공시서식 작성기준(2026.4.1. 시행)」 및 실제 DART 제출본(동양
# (주) 2026.03 분기보고서, 접수번호 20260515002582)의 목차 구조를 대조해서
# 뽑았다. 396페이지짜리 작성기준 전체를 규칙화한 게 아니라, "이 목차 항목이
# 통째로 빠지면 무조건 문제"인 구조적 필수 항목 + 표지/서명 요건 중심의
# 시드 체크리스트다. 세부 주석 항목(예: 재고자산 주석, 리스 주석 등)은
# 회사 상황에 따라 있고 없을 수 있어 여기서는 다루지 않는다.
# 계속 검토하면서 항목을 추가해나가는 걸 전제로 한다.

report_type: 분기보고서

required_sections:
  - key: COVER
    title: "표지(분기보고서)"
  - key: TTL_CEO_CERT
    title: "【 대표이사 등의 확인 】"
    reason: "제1-2-1조: 대표이사 및 신고업무 담당 이사가 기재내용을 확인·검토하고 서명해야 함"
  - key: D-0-1-1-0
    title: "I-1. 회사의 개요"
  - key: D-0-1-4-0
    title: "I-4. 주식의 총수 등"
  - key: D-0-2-0-0
    title: "II. 사업의 내용"
  - key: D-0-3-1-0
    title: "III-1. 요약재무정보"
  - key: D-0-4-0-0
    title: "IV. 이사의 경영진단 및 분석의견"
  - key: D-0-5-1-0
    title: "V-1. 외부감사에 관한 사항"
  - key: ATOC-27
    title: "VI. 이사회 등 회사의 기관에 관한 사항"
  - key: D-0-7-0-0
    title: "VII. 주주에 관한 사항"
  - key: ATOC-32
    title: "VIII. 임원 및 직원 등에 관한 사항"
  - key: D-0-9-0-0
    title: "IX. 계열회사 등에 관한 사항"
  - key: D-0-10-0-0
    title: "X. 대주주 등과의 거래내용"

# 재무제표는 연결/별도 중 최소 하나는 있어야 함 (연결대상 종속회사가 없는
# 회사는 D-0-3-2-0 없이 D-0-3-4-0만 있을 수 있어 required_sections에 넣지 않고
# 별도 규칙으로 처리)
financial_statement_alternatives:
  - D-0-3-2-0  # 연결재무제표
  - D-0-3-4-0  # 재무제표(별도)

cover_fields:
  - field: company_name
    description: "표지: 회사명"
  - field: fiscal_period
    description: "표지: 사업연도(부터~까지)"
