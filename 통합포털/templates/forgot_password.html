<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 자금포털 — 비밀번호 찾기</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-title">비밀번호 찾기</div>
      <div class="auth-subtitle">아이디를 입력하면 등록된 그룹웨어 메일로 인증코드를 보내드립니다.</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <div class="auth-field">
          <label for="username">아이디</label>
          <input type="text" id="username" name="username" required autofocus>
        </div>
        <button type="submit" class="btn-primary">인증코드 받기</button>
      </form>

      <div class="auth-links">
        <a href="{{ url_for('login') }}">← 로그인 화면으로</a>
      </div>
    </div>
  </div>
</body>
</html>
