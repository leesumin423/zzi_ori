<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 자금포털 — 접근 요청</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-title">접근 요청</div>
      <div class="auth-subtitle">관리자가 승인하면 로그인 아이디/비밀번호를 알려드립니다.</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <div class="auth-field">
          <label for="display_name">이름</label>
          <input type="text" id="display_name" name="display_name" required autofocus>
        </div>
        <div class="auth-field">
          <label for="username">그룹웨어 아이디</label>
          <input type="text" id="username" name="username" required placeholder="예: shpark">
          <div class="field-hint">가입 승인 시 <strong>아이디@{{ email_domain }}</strong> 메일로 초기 비밀번호가 발송됩니다.</div>
        </div>
        <div class="auth-field">
          <label for="team">소속 팀</label>
          <input type="text" id="team" name="team" required placeholder="예: 자금팀">
        </div>
        <div class="auth-field">
          <label for="reason">요청 사유 (선택)</label>
          <textarea id="reason" name="reason" placeholder="예: 차입금 현황 조회 목적"></textarea>
        </div>
        <button type="submit" class="btn-primary">요청 보내기</button>
      </form>

      <div class="auth-links">
        <a href="{{ url_for('login') }}">← 로그인 화면으로</a>
      </div>
    </div>
  </div>
</body>
</html>
